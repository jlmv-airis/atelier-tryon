name: Backend · test & deploy (Render)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: tryon-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}
    steps:
      - name: Trigger deploy
        id: deploy
        run: |
          RESP=$(curl -fsS -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}')
          echo "$RESP"
          echo "id=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')" >> "$GITHUB_OUTPUT"
      - name: Wait for deploy to go live (max 15 min)
        run: |
          for i in $(seq 1 90); do
            STATUS=$(curl -fsS "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/${{ steps.deploy.outputs.id }}" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" -H "Accept: application/json" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')
            echo "[$i] $STATUS"
            case "$STATUS" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 10
          done
          echo "timeout esperando deploy"; exit 1
      - name: Smoke test /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.BACKEND_URL }}/health" | grep -q '"status":"ok"'; then
              echo "healthy"; exit 0
            fi
            sleep 10
          done
          echo "backend no respondio a tiempo"; exit 1
