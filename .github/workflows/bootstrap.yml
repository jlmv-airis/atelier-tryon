name: Bootstrap · Supabase storage, modelo por defecto, schema, Render y Vercel

# Ejecucion manual, idempotente (se puede repetir). Requiere los secrets/variables de FREE-STACK.md.

on:
  workflow_dispatch:
    inputs:
      regenerate_model:
        description: "Regenerar models/default.jpg aunque ya exista"
        type: boolean
        default: false
      seed:
        description: "Seed para la modelo por defecto"
        default: "7"

concurrency:
  group: bootstrap
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_BUCKET: tryon
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  AI_PROVIDER: hf

jobs:
  storage-and-model:
    name: 1 · Supabase Storage + modelo por defecto
    runs-on: ubuntu-latest
    outputs:
      model_url: ${{ steps.gen.outputs.url }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Crear bucket publico (idempotente)
        run: python -m scripts.bootstrap_storage
      - name: Generar o reutilizar models/default.jpg
        id: gen
        run: |
          URL="$SUPABASE_URL/storage/v1/object/public/$SUPABASE_BUCKET/models/default.jpg"
          if [ "${{ inputs.regenerate_model }}" != "true" ] && curl -fsS -o default.jpg "$URL"; then
            echo "ya existe: $URL"
          else
            python -m scripts.generate_default_model --out default.jpg --seed "${{ inputs.seed }}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Verificar URL publica
        run: |
          curl -fsS -o /dev/null -w "default.jpg publico %{http_code}\n" "${{ steps.gen.outputs.url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: default-model
          path: backend/default.jpg
          retention-days: 30

  schema:
    name: 2 · Supabase schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Aplicar supabase/schema.sql (idempotente)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST || 'aws-0-us-east-1.pooler.supabase.com' }}
        run: |
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          CONN="host=$SUPABASE_DB_HOST port=5432 dbname=postgres user=postgres.$REF sslmode=require"
          psql "$CONN" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          N=$(psql "$CONN" -tAc "select count(*) from information_schema.columns where table_name='tryon_jobs'")
          echo "columnas en tryon_jobs: $N"; [ "$N" -ge 15 ]

  render:
    name: 3 · Variables Render + deploy
    runs-on: ubuntu-latest
    needs: [storage-and-model, schema]
    steps:
      - name: Cargar variables de entorno en Render
        run: |
          python3 - <<'EOF' > env.json
          import json, os
          env = {
              "AI_PROVIDER": "hf",
              "HF_TOKEN": os.environ["HF_TOKEN"],
              "SUPABASE_URL": os.environ["SUPABASE_URL"],
              "SUPABASE_SERVICE_KEY": os.environ["SUPABASE_SERVICE_KEY"],
              "SUPABASE_BUCKET": "tryon",
              "DEFAULT_PERSON_IMAGE_URL": "${{ needs.storage-and-model.outputs.model_url }}",
              "CORS_ORIGINS": "${{ vars.FRONTEND_URL || '*' }}",
              "REFINE_REQUIRED": "false",
              "JOB_TTL_SECONDS": "86400",
              "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
          }
          print(json.dumps([{"key": k, "value": v} for k, v in env.items() if v]))
          EOF
          curl -fsS -X PUT "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/env-vars" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            --data @env.json > /dev/null && echo "variables cargadas"
      - name: Deploy
        id: deploy
        run: |
          RESP=$(curl -fsS -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}')
          echo "id=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')" >> "$GITHUB_OUTPUT"
      - name: Esperar /health sano (max 15 min)
        run: |
          for i in $(seq 1 90); do
            BODY=$(curl -fsS -m 20 "${{ vars.BACKEND_URL }}/health" 2>/dev/null || true)
            echo "[$i] $BODY"
            if echo "$BODY" | grep -q '"missing_env":\[\]' && echo "$BODY" | grep -q '"storage":true'; then
              echo "backend OK"; exit 0
            fi
            sleep 10
          done
          echo "backend no quedo sano"; exit 1

  vercel:
    name: 4 · Variables Vercel + deploy
    runs-on: ubuntu-latest
    needs: render
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g vercel@latest
      - name: Cargar NEXT_PUBLIC_API_URL (production + preview)
        working-directory: frontend
        run: |
          for ENV in production preview; do
            vercel env rm NEXT_PUBLIC_API_URL "$ENV" --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
            printf '%s' "${{ vars.BACKEND_URL }}" | vercel env add NEXT_PUBLIC_API_URL "$ENV" --token=${{ secrets.VERCEL_TOKEN }}
          done
      - name: Deploy production
        working-directory: frontend
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "FRONTEND_URL=$URL"
          echo "### Frontend: $URL" >> "$GITHUB_STEP_SUMMARY"
