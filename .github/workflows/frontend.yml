name: Frontend · build check (deploy lo hace Vercel en cada push)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.BACKEND_URL }}
      - name: Verificar frontend en produccion
        if: github.event_name != 'pull_request' && vars.FRONTEND_URL != ''
        run: |
          sleep 90   # Vercel despliega en paralelo por su integracion Git
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null "${{ vars.FRONTEND_URL }}"; then echo "frontend OK"; exit 0; fi
            sleep 10
          done
          echo "frontend no responde"; exit 1
